<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Archery</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 12px;
            background-color: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100dvh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: white;
        }
        .music-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 15;
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(6px);
        }
        .music-btn:hover {
            background: rgba(255, 77, 109, 0.35);
        }
        canvas {
            background: linear-gradient(to bottom, #16213e, #0f3460);
            border: 3px solid #e94560;
            border-radius: 14px;
            box-shadow: 0 0 25px rgba(233, 69, 96, 0.45);
            cursor: crosshair;
            touch-action: none;
            display: block;
        }
        #birthdayCard {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            background: #fff8fa;
            color: #2b2d42;
            padding: clamp(22px, 4vw, 38px);
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.75);
            border: 4px solid #ff4d6d;
            width: min(560px, 92vw);
            max-height: 90dvh;
            overflow-y: auto;
            animation: popUp 0.4s ease-out;
        }
        #birthdayCard h1 {
            color: #d90429;
            margin: 0 0 10px 0;
            font-size: clamp(1.7rem, 4.5vw, 2.6rem);
            outline: none;
        }
        #birthdayCard p {
            margin: 0 0 16px 0;
            font-size: clamp(1rem, 2.4vw, 1.25rem);
            color: #4a4e69;
            outline: none;
        }
        #birthdayCard img {
            width: 100%;
            max-height: min(600px, 44dvh);
            object-fit: cover;
            border-radius: 16px;
            border: 3px solid #ff758f;
            margin-bottom: 18px;
        }
        .replay-btn {
            background: linear-gradient(135deg, #ff4d6d, #d90429);
            color: white;
            border: none;
            padding: clamp(12px, 2.2vw, 16px) clamp(28px, 5vw, 42px);
            border-radius: 14px;
            font-size: clamp(1rem, 2.8vw, 1.25rem);
            font-weight: 700;
            letter-spacing: 0.4px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(217, 4, 41, 0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .replay-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(217, 4, 41, 0.5);
        }
        .replay-btn:active {
            transform: translateY(0);
        }
        @keyframes popUp {
            0% {
                transform: translate(-50%, -50%) scale(0.35);
                opacity: 0;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <button id="musicBtn" class="music-btn" type="button" aria-label="Toggle Music">🔊 Music: ON</button>
    <audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>
    <audio id="winMusic" src="win.mp3" preload="auto"></audio>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div id="birthdayCard">
        <h1 contenteditable="true">Happy Birthday, Beb! ❤️</h1>
        <p contenteditable="true">"Your smile is my favorite view. Happy birthday, sweetheart."</p>
        <img id="couplePhoto" src="iloveyou.jpg" alt="Picture Namin">
        <br>
        <button id="replayBtn" class="replay-btn">Reply</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
