<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday Beb ❤️ </title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 8px;
            background-color: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100dvh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: white;
        }
        .music-btn {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 15;
            background: rgba(255, 255, 255, 0.16);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 7px 13px;
            border-radius: 999px;
            font-size: clamp(0.78rem, 2.5vw, 0.9rem);
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(6px);
        }
        .music-btn:hover {
            background: rgba(255, 77, 109, 0.35);
        }
        canvas {
            background: linear-gradient(to bottom, #16213e, #0f3460);
            border: 3px solid #e94560;
            border-radius: 14px;
            box-shadow: 0 0 25px rgba(233, 69, 96, 0.45);
            cursor: crosshair;
            touch-action: none;
            display: block;
            max-width: 100%;
            max-height: 100%;
        }
        #birthdayCard {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            background: #fff8fa;
            color: #2b2d42;
            padding: clamp(18px, 3.5vw, 34px);
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.75);
            border: 4px solid #ff4d6d;
            width: min(540px, 92vw);
            max-height: 88dvh;
            overflow-y: auto;
            animation: popUp 0.4s ease-out;
        }
        #birthdayCard h1 {
            color: #d90429;
            margin: 0 0 8px 0;
            font-size: clamp(1.4rem, 4.5vw, 2.5rem);
            outline: none;
        }
        #birthdayCard p {
            margin: 0 0 14px 0;
            font-size: clamp(0.92rem, 2.7vw, 1.2rem);
            color: #4a4e69;
            outline: none;
        }
        #birthdayCard img {
            width: 100%;
            max-height: min(360px, 40dvh);
            object-fit: cover;
            border-radius: 14px;
            border: 3px solid #ff758f;
            margin-bottom: 16px;
        }
        .replay-btn {
            background: linear-gradient(135deg, #ff4d6d, #d90429);
            color: white;
            border: none;
            padding: clamp(11px, 2vw, 15px) clamp(26px, 5vw, 40px);
            border-radius: 14px;
            font-size: clamp(0.95rem, 3vw, 1.2rem);
            font-weight: 700;
            letter-spacing: 0.4px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(217, 4, 41, 0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .replay-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(217, 4, 41, 0.5);
        }
        .replay-btn:active {
            transform: translateY(0);
        }
        @keyframes popUp {
            0% {
                transform: translate(-50%, -50%) scale(0.35);
                opacity: 0;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <button id="musicBtn" class="music-btn" type="button" aria-label="Toggle Music">🔊 Music: ON</button>
    <audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>
    <audio id="winMusic" src="win.mp3" preload="auto"></audio>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div id="birthdayCard">
        <h1 contenteditable="true">Happy Birthday, Beb! ❤️</h1>
        <p contenteditable="true">"Your smile is my favorite view. Happy birthday, beb ❤️ ."</p>
        <img id="couplePhoto" src="iloveyou.jpg" alt="Picture Namin">
        <br>
        <button id="replayBtn" class="replay-btn">Reply</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
